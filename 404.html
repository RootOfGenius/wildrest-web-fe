<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Lạc đường rồi! · WildRest.vn</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(ellipse at center, #673a2d, #211d24);
      }
      main {
        padding: 32px;
        max-width: 700px;
      }
      h1 {
        font-size: clamp(44px, 8vw, 72px);
        margin: 24px 0;
      }
      p {
        margin: 20px 0 30px;
        color: #e2d5cd;
      }
      .coordinates {
        font: 20px var(--heading);
        color: #ffc779;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="coordinates">LỖI 404 · NGOÀI BẢN ĐỒ</span>
      <h1>Bạn đã chết!</h1>
      <p>
        Đùa thôi, bạn chỉ đi lạc khỏi con đường mòn.<br />Trang này không tồn
        tại. Về lửa trại cùng mọi người nhé!
      </p>
      <a class="button" href="/">Hồi sinh → Về trang chủ</a>
    </main>
  </body>
</html>
